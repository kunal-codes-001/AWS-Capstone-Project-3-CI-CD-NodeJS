version: 0.2

phases:

  install:
    runtime-versions:
      nodejs: 20

  pre_build:
    commands:
      - echo "Installing dependencies..."
      - npm install

  build:
    commands:
      - echo "Running tests..."
      - npm test
      - echo "Build completed successfully."

artifacts:
  files:
    - '**/*'
  discard-paths: no